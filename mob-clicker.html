<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mobfarm</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0c08;--cd:#2c150d;--ac:#ff7a1a;--a2:#ff3b1f;--tx:#fff1e6;--mu:#b58f7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-th=lime]{--bg:#0b1a0a;--cd:#15290f;--ac:#8fe02a;--a2:#3fae2a;--tx:#eaffdc;--mu:#86a877}
[data-th=ocean]{--bg:#08141f;--cd:#0e2434;--ac:#28c4ff;--a2:#1f6fe0;--tx:#e3f6ff;--mu:#7aa3b8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column}
h2,.n{font-family:"Russo One",system-ui,sans-serif;font-weight:400}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cd)}
.av{width:38px;height:38px;border-radius:8px;background:var(--ac);color:#111;display:grid;place-items:center;font:20px "Russo One",sans-serif;position:relative;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#top .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .r{text-align:right}#xp{font-size:20px;color:var(--ac)}#xps{font-size:12px;color:var(--mu)}
#v{flex:1;overflow-y:auto;padding:14px}
#tabs{display:flex;background:var(--cd)}
#tabs button{flex:1;padding:14px 0;background:none;border:0;color:var(--mu);font:14px "Russo One",sans-serif;border-top:3px solid transparent}
#tabs button.on{color:var(--ac);border-top-color:var(--ac)}
#big{display:block;width:210px;height:210px;margin:18px auto;border-radius:50%;border:0;color:#160a04;background:radial-gradient(circle at 35% 30%,var(--ac),var(--a2));box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 50px color-mix(in srgb,var(--ac) 35%,transparent);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
#big:active{transform:translateY(8px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#big:focus-visible,button:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
#big svg{width:110px;height:110px}
.c{background:var(--cd);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row img,.ic{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;flex:none}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:15px}.row small{color:var(--mu);font-size:12px}
.b{border:0;border-radius:8px;padding:9px 11px;font:13px "Russo One",sans-serif;background:var(--ac);color:#160a04;cursor:pointer;min-width:74px}
.b.s{background:transparent;color:var(--tx);border:2px solid var(--mu)}.b.s.on{border-color:var(--ac);color:var(--ac)}
.b[disabled],.b.off{opacity:.35}
.g{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;width:58px;height:58px;background:var(--cd);border-radius:8px;border:2px solid transparent;padding:4px}
.chip.on{border-color:var(--ac)}.chip img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.chip i{position:absolute;right:3px;bottom:1px;font:11px "Russo One",sans-serif;font-style:normal}
button.chip{cursor:pointer}
.arena{display:flex;justify-content:space-around;gap:6px;margin:8px 0 18px}
.u{width:31%;text-align:center}.u img{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated}
.u.d{opacity:.25;filter:grayscale(1)}.u.h img{animation:hurt .4s}
.hb{height:7px;background:#0007;border-radius:4px;overflow:hidden}.hb i{display:block;height:100%;background:var(--ac)}
@keyframes hurt{30%{transform:translateX(-6px);filter:brightness(2) sepia(1) hue-rotate(-30deg) saturate(6)}60%{transform:translateX(6px)}}
.fl{position:fixed;pointer-events:none;font:22px "Russo One",sans-serif;color:var(--ac);animation:up .7s forwards;text-shadow:0 2px 0 #0008}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--cd);border:2px solid var(--ac);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated}
.pf{text-align:center;margin-bottom:14px}.pf .av{width:84px;height:84px;font-size:40px;margin:0 auto 8px;border-radius:14px}
.lbl{color:var(--mu);font-size:13px;margin:14px 0 6px}
.res{text-align:center;font-size:22px;margin:6px 0 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#big{width:170px;height:170px;margin:8px auto}#big svg{width:90px;height:90px}#big.dim{filter:saturate(.3) brightness(.75)}
.rv{min-height:180px;display:grid;place-items:center;text-align:center;color:var(--mu);font-size:14px;padding:0 20px}
.card{display:grid;justify-items:center;gap:4px;animation:rise .6s cubic-bezier(.2,1.4,.4,1);color:var(--tx)}
.card img{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 18px var(--ac))}
@keyframes rise{from{transform:translateY(70px) scale(.5);opacity:0}}
.cst{text-align:center;font-size:18px;color:var(--ac);margin:10px 0 4px}
.pen{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--cd);border-radius:10px;border-bottom:6px solid color-mix(in srgb,var(--ac) 40%,#000);min-height:84px}
.pm{position:relative;width:52px;height:52px;animation:bob 1.6s ease-in-out infinite}.pm img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.pm i{position:absolute;right:0;bottom:-2px;font:11px "Russo One",sans-serif;font-style:normal}
@keyframes bob{50%{transform:translateY(-7px)}}.lk{filter:brightness(0) opacity(.5)}
.ctl{display:flex;justify-content:space-between;align-items:center;padding:0 6px;user-select:none;-webkit-user-select:none;touch-action:none}
.dp{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dp button{background:var(--cd);border:2px solid var(--mu);border-radius:10px;color:var(--tx);touch-action:none;display:grid;place-items:center}
.dp button:active{background:var(--ac);color:#160a04}.dp svg{width:26px;height:26px}
.hitb{width:108px;height:108px;border-radius:50%;border:0;font:20px "Russo One",sans-serif;color:#160a04;background:radial-gradient(circle at 35% 30%,var(--ac),var(--a2));touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.35);user-select:none}.hitb:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.hb em{display:block;height:100%;background:var(--ac)}.chip.dead{opacity:.3}
#splash{position:fixed;inset:0;z-index:20;background:#000;display:grid;transition:opacity .5s;cursor:pointer}#splash.out{opacity:0;pointer-events:none}
#splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#splash h1{position:relative;align-self:end;width:100%;text-align:center;padding:70px 0 calc(40px + env(safe-area-inset-bottom,0px));font:46px "Russo One",sans-serif;letter-spacing:2px;color:#fff;background:linear-gradient(transparent,#000d)}
.ico{width:22px;height:22px;overflow:visible;flex:none}.ico *{transform-box:fill-box;transform-origin:center}
.b{display:inline-flex;align-items:center;justify-content:center;gap:5px}.b .ico{width:18px;height:18px}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;font-size:12px}
#big .ico{width:90px;height:90px}
.hitb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.hitb .ico{width:38px;height:38px}
.ico text{font-family:"Russo One",sans-serif}
.k-sw{transform-origin:50% 95%!important}
.play .k-ex{animation:ex 1.5s ease-in-out both}
.play .k-fall{animation:fall 1.5s ease-in-out both}
.play .k-fly{animation:fly 1.2s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--dl,0s)}
.play .k-swl{animation:swl 1.5s ease-out both}.play .k-swr{animation:swr 1.5s ease-out both}.play .k-sp{animation:sp 1.5s both}
.play .k-la{animation:la 1.4s ease-in-out both;animation-delay:var(--dl,0s)}
.play .k-sw{animation:swing 1.5s ease-in-out both}.play .k-fl{animation:fl 1.5s both}
.play .k-ig{animation:ig 1.5s ease-out both;animation-delay:var(--dl,0s)}
.play .k-co{animation:co 1.5s ease-in-out both}
.play .k-ri{animation:ri 1.1s ease-out both;animation-delay:var(--dl,0s)}
.play .k-mg{animation:mgk 1.5s ease-in-out both}
.play .k-rot{animation:rot 1.5s ease-in-out both}
.play .k-fl2{animation:fl2 1.5s ease-in-out both}
.play .k-gr{animation:gr 1.2s ease-out both;animation-delay:var(--dl,0s)}
.play .k-wv{animation:wv 1.5s ease-in-out both}
.play .k-pp{animation:pp 1.5s ease-in-out both}.play .k-fp{animation:fp 1.5s ease-in-out both}
@keyframes ex{0%,100%{transform:none;opacity:1}35%,60%{transform:translate(var(--x),var(--y)) rotate(var(--r,0deg));opacity:.45}}
@keyframes fall{0%{transform:none}30%,60%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:.5}85%{transform:translateY(-3px);opacity:1}100%{transform:none}}
@keyframes fly{0%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}65%,100%{transform:none;opacity:1}}
@keyframes swl{0%{transform:translate(-14px,8px) rotate(-30deg);opacity:0}45%{transform:none;opacity:1}55%{transform:translate(1px,-1px) rotate(5deg)}100%{transform:none;opacity:1}}
@keyframes swr{0%{transform:translate(14px,8px) rotate(30deg);opacity:0}45%{transform:none;opacity:1}55%{transform:translate(-1px,-1px) rotate(-5deg)}100%{transform:none;opacity:1}}
@keyframes sp{0%,45%{transform:scale(0);opacity:0}55%{transform:scale(1.7);opacity:1}100%{transform:scale(0);opacity:0}}
@keyframes la{0%{transform:none;opacity:1}30%{transform:translateY(-24px);opacity:0}31%{transform:translateY(24px);opacity:0}75%,100%{transform:none;opacity:1}}
@keyframes swing{0%{transform:rotate(-70deg)}25%{transform:rotate(60deg)}45%{transform:rotate(-15deg)}60%{transform:rotate(10deg)}100%{transform:none}}
@keyframes fl{0%,15%{opacity:0}25%{opacity:1}60%,100%{opacity:0}}
@keyframes ig{0%{transform:scale(.1);fill:#777;opacity:.3}30%{transform:scale(1.35);fill:#ffd23a;opacity:1}55%{transform:scale(.85)}75%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes co{0%,100%{transform:none}20%,60%{transform:translateY(-6px) scaleX(0)}40%{transform:translateY(-8px) scaleX(-1)}80%{transform:scaleX(1)}}
@keyframes ri{0%{transform:translateY(8px);opacity:0}40%{opacity:1}65%{transform:translateY(-3px)}100%{transform:none;opacity:1}}
@keyframes mgk{0%,100%{transform:none}40%,55%{transform:translate(var(--x),var(--y)) scale(1.25)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fl2{0%,100%{transform:none}20%{transform:scale(1.2,.85)}40%{transform:scale(.85,1.2) rotate(-6deg)}60%{transform:scale(1.15,.9) rotate(6deg)}80%{transform:scale(.95,1.1)}}
@keyframes gr{0%{transform:scale(0)}50%{transform:scale(1.25)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes wv{0%,100%{transform:none}25%{transform:translateX(var(--x))}75%{transform:translateX(calc(var(--x) * -1))}}
@keyframes pp{0%{transform:scale(1)}30%{transform:scale(1.4) rotate(-12deg)}60%{transform:scale(.9) rotate(8deg)}100%{transform:none}}
@keyframes fp{0%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(0)}50%{transform:scaleX(-1)}}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapb{background:var(--cd);border:2px solid transparent;border-radius:10px;padding:6px;color:var(--tx);font:13px "Russo One",sans-serif;display:grid;gap:4px;justify-items:center;cursor:pointer}
.mapb.on{border-color:var(--ac)}.mapb canvas{width:100%;max-width:120px;aspect-ratio:1;border-radius:6px;image-rendering:pixelated}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg::before,#bg::after{content:"";position:absolute;inset:-30%;filter:blur(34px);background:radial-gradient(circle at 25% 30%,color-mix(in srgb,var(--ac) 40%,transparent),transparent 45%),radial-gradient(circle at 75% 70%,color-mix(in srgb,var(--a2) 36%,transparent),transparent 45%);animation:glow 14s ease-in-out infinite alternate}
#bg::after{background:radial-gradient(circle at 72% 22%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 40%),radial-gradient(circle at 18% 82%,color-mix(in srgb,var(--a2) 32%,transparent),transparent 42%);animation-duration:19s;animation-direction:alternate-reverse}
@keyframes glow{0%{transform:translate(-4%,-3%) scale(1) rotate(0);opacity:1}50%{transform:translate(5%,4%) scale(1.15) rotate(8deg);opacity:.6}100%{transform:translate(-2%,6%) scale(1.05) rotate(-6deg);opacity:.95}}
#app{position:relative;z-index:1}
#top,#tabs{background:color-mix(in srgb,var(--cd) 80%,transparent);backdrop-filter:blur(8px)}
#cn{font-size:12px;color:var(--ac);display:flex;justify-content:flex-end;align-items:center;gap:3px}#cn .ico{width:12px;height:12px}
.b.inf{min-width:0;padding:8px}.b.inf .ico{width:20px;height:20px}
.ic2{width:48px;height:48px;display:grid;place-items:center;color:var(--ac);flex:none}.ic2 .ico{width:30px;height:30px}
#modal{position:fixed;inset:0;z-index:15;background:#000b;display:none;place-items:center}#modal.on{display:grid}
.mc{background:var(--cd);border-radius:14px;padding:16px;width:90%;max-width:360px;max-height:88%;overflow:auto}
.ir{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.ir b{color:var(--ac)}
.k-lid{transform-origin:0% 100%!important}
.play .k-lid{animation:lid 1.5s ease-in-out both}.play .k-cn{animation:cn 1.5s ease-in-out both}.play .k-bn{animation:bn 1.5s ease-in-out both}
@keyframes lid{0%,100%{transform:none}25%,70%{transform:rotate(-55deg) translate(-2px,-2px)}}
@keyframes cn{0%{opacity:0;transform:none}30%{opacity:1;transform:translateY(-9px) rotate(180deg)}60%{opacity:1;transform:translateY(-12px) rotate(360deg)}100%{opacity:0;transform:translateY(-3px)}}
@keyframes bn{0%,100%{transform:none}25%{transform:translateY(-4px) scale(1.15)}50%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#splash{transition:opacity .25s}
#splash.run img{animation:zi .75s ease-out both}#splash.run h1{animation:tu .75s ease-out both}
@keyframes zi{from{transform:scale(1.2);opacity:0}35%{opacity:1}to{transform:scale(1)}}
@keyframes tu{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
